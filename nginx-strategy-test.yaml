apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-strategy-test
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nginx-strategy
  template:
    metadata:
      labels:
        app: nginx-strategy
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
